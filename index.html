<script>

const FIELDS=[['mode','Mode',[['1','You vs bot'],['2','2 players'],['0','Watch bots']]],
['game','Game',[['classic','Classic: wipe out the other team'],['king','Protect the King: hit their ♛ to win'],['convert','Recruit: hit foes to convert them'],['moving','Moving circles'],['royale','Battle Royale: free for all, last bot standing'],['boss','Boss fight: your team vs one big boss']]],
['rules','Rules',[['skill','Bot skills'],['nerd','Nerd mode: type equations']]],
['learn','Brain learning',[['slow','Slowly adapts: starts clumsy, gets smarter'],['max','Insanely smart from the first shot']]],['level','AI difficulty',[['0','Easy'],['1','Medium'],['2','Hard'],['3','Insane']]],['theme','Arena',[['0','Midnight'],['1','Sunset'],['2','Forest'],['3','Ice'],['4','Paper']]],['twist','Twist',[['','None'],['wind','Crosswind'],['mines','Mines'],['timer','12s turn timer'],['meteor','Meteors'],['loot','Loot crates']]]];
const mk=(id,label,opts,val)=>{const f=document.createElement('div');f.className='f';f.innerHTML=`<label for="${id}">${label}</label><select id="${id}">${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select><small id="${id}d"></small>`;f.querySelector('select').value=val;return f};
const botOpts=[['','Pick a bot'],...KEYS.map(k=>[k,K[k][0]+' Bot']),['random','Random bot'],['mixed','Mixed team']];
{const box=$('fields');box.style.cssText='display:flex;flex-direction:column;gap:10px';
 for(const [id,l,o] of FIELDS)box.append(mk(id,l,o,id=='level'?'1':o[0][0]));

 const row=document.createElement('div');row.className='row';
 row.append(mk('size','Team size',[['2','2 v 2'],['4','4 v 4'],['8','8 v 8'],['12','12 v 12'],['16','16 v 16']],'8'),mk('time','Timer',[['60','1 minute'],['180','3 minutes'],['300','5 minutes'],['0','Off']],'180'));box.append(row)}
const GDESC={classic:'Coin toss picks who starts. Max 4 kills per shot. A team outnumbered 2 to 1 gets a REVENGE shot every turn (ghost + bigger hit zone). Ties go to sudden death.',king:'Each team has a crown. Hit it to win instantly.',convert:'Foes you hit switch to your team.',moving:'The circles keep drifting up and down.',royale:'Free for all. The zone shrinks every round, crates give loot, and wrecks are mines.',boss:'The boss has 4 HP and shoots twice per turn.'};
// ---------- state ----------
let rev=[0,0],ot=0,CAP=4,starter=Math.random()<.5?1:0,wind=0,flash=0,tl=12,wrecks=[],zone=999,bots,rocks,gems,crates,turn,idx,me,angle,st='over',anim,fx=[],cam={x:300,y:300,z:1},view,wait=0,left=0,count=0,paused=false,started=false,armed=null,extra=false,shake=0,dir=1,bubbles=[],T=0,last=0,wasOver=false;
let save={coins:50,inv:{},owned:['yellow','blue'],skin:'yellow',wins:0,played:0,kills:0,shots:0,hits:0,ach:{},day:'',muted:false};
try{Object.assign(save,JSON.parse(localStorage.getItem('graphbots')||'{}'))}catch(e){}
const skin=()=>save.skin=='rainbow'?`hsl(${T/8%360} 90% 60%)`:SKINS[save.skin][2],mode=()=>$('mode').value,nerd=()=>$('rules').value=='nerd',earning=()=>mode()=='1';
const tw=n=>$('twist').value==n,royale=()=>$('game').value=='royale',minesOn=()=>royale()||tw('mines'),human=()=>mode()=='2'&&(!royale()||turn<2)||(mode()=='1'&&turn==0);
const alive=t=>bots.filter(o=>o.t==t&&o.up),foesOf=()=>bots.filter(o=>o.up&&o.t!=turn);
const PAL=['#ff7a59','#58c8ff','#c4f23a','#ff4fb3','#a88bff','#2ee6e6','#e0a46a','#e8eefc'],teamCol=t=>t==0?skin():royale()?PAL[(t-1)%PAL.length]:'#ff7a59',gx=p=>(p.x-300)/U,gy=p=>(300-p.y)/U;
function keep(){try{localStorage.setItem('graphbots',JSON.stringify(save))}catch(e){}$('wallet').textContent='🪙 '+save.coins;$('a').querySelector('b').style.color=skin()}
function say(t){$('say').textContent=t}
// ---------- audio ----------
let AC,muted=false;
addEventListener('pointerdown',()=>{try{AC||=new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}});
function tone(f,d=.12,ty='square',to=f,v=.1,w=0){if(!AC||muted)return;const t=AC.currentTime+w,o=AC.createOscillator(),a=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(to,t+d);a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a).connect(AC.destination);o.start(t);o.stop(t+d)}
function noise(d=.3,v=.2,fr=900){if(!AC||muted)return;const n=AC.createBufferSource(),b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0),f=AC.createBiquadFilter(),m=AC.createGain();for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length)**2;n.buffer=b;f.type='lowpass';f.frequency.value=fr;m.gain.value=v;n.connect(f).connect(m).connect(AC.destination);n.start()}
// ---------- equation parser (safe, no eval) ----------
const FN={asin:Math.asin,acos:Math.acos,atan:Math.atan,sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,sin:Math.sin,cos:Math.cos,tan:Math.tan,sqrt:Math.sqrt,'√':Math.sqrt,abs:Math.abs,log:Math.log10,ln:Math.log,exp:Math.exp,floor:Math.floor,ceil:Math.ceil,round:Math.round,sign:Math.sign};
const CON={pi:Math.PI,'π':Math.PI,tau:2*Math.PI,'τ':2*Math.PI,phi:1.618034,'φ':1.618034,e:Math.E};
function compile(src){
  const names=[...Object.keys(FN),...Object.keys(CON),'x','t'].sort((a,b)=>b.length-a.length),tk=[];
  const q=src.toLowerCase().replace(/\s/g,'').replace(/−/g,'-').replace(/²/g,'^2');
  for(let i=0;i<q.length;){const num=/^(\d+\.?\d*|\.\d+)/.exec(q.slice(i)),n=num?num[0]:names.find(n=>q.startsWith(n,i))||('+-*/^()'.includes(q[i])&&q[i]);if(!n)throw Error('Unknown symbol "'+q[i]+'"');tk.push(n);i+=n.length}
  let i=0;
  const sum=()=>{let a=term();while(tk[i]=='+'||tk[i]=='-'){const o=tk[i++],l=a,r=term();a=o=='+'?v=>l(v)+r(v):v=>l(v)-r(v)}return a};
  const term=()=>{let a=unary();while(i<tk.length&&!['+','-',')'].includes(tk[i])){const o=tk[i]=='*'||tk[i]=='/'?tk[i++]:'*',l=a,r=unary();a=o=='*'?v=>l(v)*r(v):v=>l(v)/r(v)}return a};
  const unary=()=>{if(tk[i]=='-'){i++;const a=unary();return v=>-a(v)}if(tk[i]=='+')i++;const a=atom();if(tk[i]=='^'){i++;const b=unary();return v=>Math.pow(a(v),b(v))}return a};
  const atom=()=>{const k=tk[i++];
    if(k=='('){const a=sum();if(tk[i++]!=')')throw Error('Missing )');return a}
    if(FN[k]){const a=atom();return v=>FN[k](a(v))}
    if(k in CON)return()=>CON[k];
    if(k=='x'||k=='t')return v=>v[k];
    if(k&&!isNaN(k))return()=>+k;
    throw Error('Equation is incomplete')};
  const f=sum();if(i<tk.length)throw Error('Check your brackets');return f;
}
function curve(text){ // "f(x)" or parametric "x(t) ; y(t)"
  const part=text.split(';').map(p=>compile(p.replace(/^.*=/,'')));
  if(part.length>2)throw Error('Use one equation, or x(t) ; y(t)');
  const o={x:gx(me),y:gy(me)},two=part.length==2,at=s=>{const v=two?{t:s,x:s}:{x:o.x+dir*s,t:o.x+dir*s};return two?[part[0](v),part[1](v)]:[v.x,part[0](v)]};
  const z=at(0);if(!z.every(isFinite))throw Error('Not defined where your bot stands');

}
function blocked(p,k){return k!='sniper'&&armed!='ghost'&&!me.ghost&&rocks.find(r=>D(p,r)<r.r&&D(me,r)>=r.r&&!r.holes.some(h=>D(p,h)<h.r))}
function traceEq(text){
  const f=curve(text),path=[me],kills=[],holes=[];let prev={x:me.x,y:me.y},mined=null,mines=[];
  walk:for(let t=.05;t<=100;t+=.05){
    const q=f(t),d=D(prev,q);if(!(d<300))break;
    const n=Math.ceil(d/5)||1;
    for(let j=1;j<=n;j++){
      const p={x:prev.x+(q.x-prev.x)*j/n,y:prev.y+(q.y-prev.y)*j/n};
      if(p.x<0||p.x>S||p.y<0||p.y>S)break walk;
      if(D(p,path[path.length-1])>=4)path.push(p);
      const r=blocked(p);if(r){holes.push({r,p});break walk}
      if(minesOn()&&wrecks.some(w=>D(w,p)<13)){mined=p;break walk}
      for(const e of foesOf())if(!kills.includes(e)&&D(e,p)<13+(me.rev?8:0))kills.push(e);
    }

}
// ---------- skill shots ----------
function trace(a,b,k=me.kind){
  const paths=[],kills=[],holes=[],links=[];let reflect=null,blast=null,anchor=null,mined=null,mines=[];
  for(const off of k=='split'?[-.22,0,.22]:[0]){
    const c=Math.cos(a+off),s=Math.sin(a+off),path=[];let end=null;
    for(let t=0;t<({para:2400,bounce:1600,boom:1260}[k]||1000);t+=5){

      if(k=='irr')v=b*.4*(Math.sin(t/31.4)+.5*Math.sin(t*1.4142/23));
      if(k=='para'){const r=b*.8;u=t*.45+r*Math.sin(t/50);v=r*(1-Math.cos(t/50))}
      if(k=='sniper'||k=='bounce')v=0;
      if(k=='zig')v=b*.4*Math.asin(Math.sin(t/25));
      if(k=='lob')v=b*(t/300)**2*3;
      if(k=='cubic')v=b*.8*((t/300-1)**3+1);
      if(k=='abs')v=b*.012*Math.abs(t-300);
      if(k=='tan')v=b*.15*Math.max(-9,Math.min(9,Math.tan(t/160)));
      if(k=='log')v=b*1.2*Math.log(1+t/60);
      if(k=='spiral'){const r=b*.0035*t;u=t*.5+r*Math.sin(t/25);v=r*(1-Math.cos(t/25))}
      if(k=='ripple')v=b*.8*Math.exp(-t/400)*Math.sin(t/25);
      if(k=='saw')v=b*.4*((t/50)%2-1);
      if(k=='stair')v=b*.3*Math.floor(t/80);
      if(k=='boom'){u=250*(1-Math.cos(t/200));v=b*1.5*Math.sin(t/200)}
      const p={x:me.x+c*u-s*v,y:me.y+s*u+c*v};p.y+=wind*(t/300)**2*40;
      if(k=='bounce')for(const z of 'xy'){const w=((p[z]%1200)+1200)%1200;p[z]=w>S?1200-w:w}
      if(p.x<0||p.x>S||p.y<0||p.y>S)break;
      path.push(p);end=p;
      const r=blocked(p,k);
      if(r){if(k!='drill'){holes.push({r,p});break}if(!holes.some(h=>D(h.p,p)<12))holes.push({r,p})}
      if(minesOn()&&wrecks.some(w=>D(w,p)<13)){mined=p;break}

      if(k=='bomb')break;

      for(const c of hit)kills.push(...foesOf().filter(e=>D(e,c)<55&&!kills.includes(e)))}

    while(kills.length<4&&pool.length){pool.sort((x,y)=>D(x,from)-D(y,from));const e=pool.shift();if(D(e,from)>190)break;links.push([from,e]);kills.push(e);from=e}}

}
// ---------- AI ----------
function think(){
  const L=+$('level').value;
  if(nerd())return thinkEq(L);

  if(o.shield){circ(o.x,o.y,20,'#7b5cff33');g.strokeStyle='#7b5cff';g.lineWidth=2;g.stroke()}
  if(o.king){g.font='14px system-ui';g.textAlign='center';g.fillStyle='#ffd84d';g.fillText('♛',o.x,o.y-34-(o.boss?14:0))}
}
function drawWorld(){
  if(royale()){g.beginPath();g.rect(0,0,S,S);g.arc(300,300,zone,0,7);g.fillStyle='#ff3b5c40';g.fill('evenodd');g.strokeStyle='#ff5c78';g.lineWidth=3;g.beginPath();g.arc(300,300,zone,0,7);g.stroke()}
  for(const w of wrecks){g.fillStyle='#c8102e';g.beginPath();for(let i=0;i<20;i++){const a=i*Math.PI/10,r=i%2?7:13;g.lineTo(w.x+Math.cos(a)*r,w.y+Math.sin(a)*r)}g.closePath();g.fill();g.strokeStyle='#5a0a14';g.lineWidth=1.5;g.stroke();circ(w.x,w.y,3,'#5a0a14')}
  if(wind){g.fillStyle='#fff9';g.font='bold 16px system-ui';g.textAlign='center';g.fillText('wind '+(wind>0?'↓':'↑')+' '+Math.abs(wind*10).toFixed(0),300,24)}
  for(const c of crates){rr(c.x-9,c.y-9,18,18,3,'#c98a3d','#5e3a12',2);circ(c.x,c.y,4,'#ffd84d')}
}
function frame(now){
  const dt=Math.min(.1,(now-last)/1000||0);last=now;T=now;
  requestAnimationFrame(frame);
  if($('menu').hidden===false)return;
  const run=!paused&&count<=0;
  if(count>0&&!paused){count-=dt;if(count<=0)ui()}
  const over=st=='over',big=over?($('big').dataset.msg||''):paused?'Paused':count>0?String(Math.ceil(count)):'';
  if($('big').textContent!==big){const was=$('big').textContent;$('big').textContent=big;if(+big)tone(440,.15,'square',440,.1);else if(was=='1')tone(880,.35,'square',880,.12)}
  $('big').hidden=!big;$('big').className=paused?'small':'';if(over)$('big').style.fontSize='34px';else $('big').style.fontSize='';
  const sp=mode()=='0'?speed:1,step=dt*sp;
  if(run&&!over&&left!=Infinity){left=Math.max(0,left-step);clock();if(!left&&st=='aim')timeUp()}
  if(run&&st=='aim'&&human()&&tw('timer')){tl-=dt;$('tl').textContent='Turn '+Math.max(0,Math.ceil(tl));if(tl<=0)fire()}else if($('tl').textContent!='Time')$('tl').textContent='Time';
  if(run&&st=='aim'&&!human()&&(wait-=step)<0)me.brain?brainStep():think();
  if(run&&st=='fly'){anim.i+=(nerd()?4:['para','bounce','boom'].includes(me.kind)?5:2)*step*60*(anim.final?.45:1);if(anim.i>=anim.len+20)land()}
  if(run&&st=='rest'&&(wait-=step)<0)next();
  if(run&&$('game').value=='moving'&&(st=='aim'||st=='rest'))for(const r of rocks){if(r.y+r.vy<r.r||r.y+r.vy>S-r.r)r.vy*=-1;r.y+=r.vy;for(const h of r.holes)h.y+=r.vy}
  const d=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!=Math.round(w*d)||cv.height!=Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}
  const tip=st=='fly'&&anim.paths[0][Math.min(Math.floor(anim.i),anim.paths[0].length-1)],goal=tip?{x:tip.x,y:tip.y,z:1.45}:{x:300,y:300,z:1};
  for(const k of 'xyz')cam[k]+=(goal[k]-cam[k])*.07;
  view={k:Math.min(w,h)/S*cam.z,w,h};
  g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,w,h);
  g.translate(w/2,h/2);g.scale(view.k,view.k);g.translate(-cam.x,-cam.y);
  if(shake>.3){g.translate(R(-shake,shake)/2,R(-shake,shake)/2);shake*=.88}
  const th=THEMES[+$('theme').value],bg=g.createLinearGradient(0,0,0,S);bg.addColorStop(0,th[0]);bg.addColorStop(1,th[1]);g.fillStyle=bg;g.fillRect(0,0,S,S);
  for(let p=50;p<S;p+=50){line([{x:p,y:0},{x:p,y:S}],th[4],1);line([{x:0,y:p},{x:S,y:p}],th[4],1)}
  line([{x:300,y:0},{x:300,y:S}],th[5],1);line([{x:0,y:300},{x:S,y:300}],th[5],1);
  g.strokeStyle='#3f66b8';g.lineWidth=3;g.strokeRect(0,0,S,S);
  if(nerd()){g.font='9px system-ui';g.textAlign='center';for(let i=-15;i<=15;i++){const p=300+i*U,m=i%5==0;line([{x:p,y:0},{x:p,y:S}],m?'#ffffff40':'#ffffff14',.6);line([{x:0,y:p},{x:S,y:p}],m?'#ffffff40':'#ffffff14',.6);if(m&&Math.abs(i)<15){g.fillStyle='#9db4e0';g.fillText(i,p,310);if(i)g.fillText(-i,310,p+3)}}}
  for(const r of rocks){
    const rg=g.createRadialGradient(r.x-r.r*.3,r.y-r.r*.3,r.r*.1,r.x,r.y,r.r);rg.addColorStop(0,th[2]);rg.addColorStop(1,th[3]);
    circ(r.x,r.y,r.r,rg);g.strokeStyle='#33436b';g.lineWidth=2;g.stroke();
    g.save();g.beginPath();g.arc(r.x,r.y,r.r+1,0,7);g.clip();r.holes.forEach(o=>circ(o.x,o.y,o.r,th[1]));g.restore()}
  drawWorld();for(const c of gems){circ(c.x,c.y,11,'#ffd84d');g.strokeStyle='#a87b00';g.lineWidth=3;g.stroke();g.fillStyle='#a87b00';g.font='bold 12px system-ui';g.textAlign='center';g.fillText('★',c.x,c.y+4)}
  for(const o of bots)if(o.up){
    if(o===me&&st!='over'){g.save();g.shadowColor='#ff3b30';g.shadowBlur=18;circ(o.x,o.y,14,'#ff3b30');g.restore()}
    drawBot(o);
    if(nerd()){g.font='9px system-ui';g.textAlign='center';g.fillStyle='#cfe0ff';g.fillText(`(${gx(o).toFixed(1)}, ${gy(o).toFixed(1)})`,o.x,o.y+25)}
  }
  if(st=='aim'&&human()&&count<=0){
    g.setLineDash([5,5]);
    if(nerd()){try{if($('eq').value)line(traceEq($('eq').value).paths[0].slice(0,34),'#fff',2)}catch(e){}}
    else for(const p of trace(angle,+$('bend').value).paths)line(p.slice(0,me.kind=='para'?70:34),K[me.kind][1],2);
    g.setLineDash([]);
  }
  if(anim){
    g.globalAlpha=st=='rest'?Math.max(0,Math.min(1,wait/1.2)):over?0:1;g.lineCap=g.lineJoin='round';
    for(const p of anim.paths){const q=p.slice(0,Math.floor(anim.i));g.shadowColor=anim.c;g.shadowBlur=10;line(q,anim.c,4);g.shadowBlur=0;const hd=q[q.length-1];if(hd&&st=='fly')circ(hd.x,hd.y,5,'#fff')}
    if(anim.i>=anim.len){
      for(const [p,q] of anim.links){line([p,q],anim.c,2);circ(q.x,q.y,4,anim.c)}
      if(anim.blast)circ(anim.blast.x,anim.blast.y,55,'#ff8c1a66');
      if(anim.reflect)line([anim.reflect,me],'#7b5cff',4);
    }
    g.globalAlpha=1;
  }
  const hud=job&&st=='aim';
  if(hud){g.save();brainDraw(d);g.restore()}
  fx=fx.filter(p=>paused||p.l-->0);
  for(const p of fx){if(!paused){p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97}
    g.globalAlpha=Math.min(1,p.l/20);
    if(p.text){g.font='bold 18px system-ui';g.textAlign='center';g.fillStyle='#ffd84d';g.fillText(p.text,p.x,p.y)}
    else if(p.ring){g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(p.x,p.y,Math.max(1,(24-p.l)*2.2),0,7);g.stroke()}
    else circ(p.x,p.y,2.8,p.col)}
  g.globalAlpha=1;
  g.font='bold 14px system-ui';g.textAlign='center';
  for(const b of bubbles){if(run)b.l-=dt;const tw=g.measureText(b.text).width+16,x=Math.max(tw/2+3,Math.min(S-tw/2-3,b.bot.x)),below=b.bot.y<75,y=b.bot.y+(below?26:-58);
    rr(x-tw/2,y,tw,24,6,'#fff');g.beginPath();g.moveTo(b.bot.x-5,below?y:y+24);g.lineTo(b.bot.x+5,below?y:y+24);g.lineTo(b.bot.x,below?y-8:y+32);g.fill();g.fillStyle='#10172a';g.fillText(b.text,x,y+17)}
  bubbles=bubbles.filter(b=>b.l>0);
  if(flash>.01){g.setTransform(d,0,0,d,0,0);g.fillStyle=`rgba(255,255,255,${flash})`;g.fillRect(0,0,w,h);flash*=.85}
  if(over&&!wasOver){if(earning()&&/Left team wins|You win/.test($('say').textContent))earn(50,{x:300,y:300});[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',f,.15,i*.13));
    for(let i=0;i<140;i++)fx.push({x:R(0,600),y:R(0,250),vx:R(-1,1),vy:R(1,4),l:R(60,130),col:['#ff4fb3','#ffe14d','#4dff9a','#5ee7ff'][i%4]})}
  wasOver=over;
}
// ---------- menu & shop ----------
function menu(){
  keep();tab(false);
  const live=started&&st!='over';
  for(const id of ['mode','mine','foe','size','time','rules','level','game'])$(id).disabled=live;
  const m=mode(),N=nerd();
  $('mine').parentElement.querySelector('label').textContent=m=='2'?'Player 1 bot':m=='1'?'Your bot':'Left team';
  $('foe').parentElement.querySelector('label').textContent=m=='2'?'Player 2 bot':m=='1'?'Enemy bot':'Right team';
  const info=v=>K[v]?K[v][3]:v=='random'?'One random kind for the team.':v=='mixed'?'Every bot is a random kind.':'';
  $('sized').textContent=royale()?'Battle Royale: this many bots in total.':'';$('mined').textContent=info($('mine').value);$('foed').textContent=info($('foe').value);$('gamed').textContent=GDESC[$('game').value];
  $('rulesd').textContent=N?'Type y = f(x), e.g. x^2/10 or sin(x), or parametric 5*sin(t) ; t.':'Each bot has one skill.';
  for(const id of ['mine','foe']){const sel=$(id),has=sel.querySelector('[value=brain]');
    if(m=='0'&&!has)sel.add(new Option('🧠 Brain Bot (adapts)','brain'));if(m!='0'&&has)has.remove();
    sel.parentElement.hidden=N&&m!='0';if(sel.value=='brain')$(id+'d').textContent='Simulates thousands of shots, uses any weapon and learns what works.'}
  const anyBrain=m=='0'&&[$('mine').value,$('foe').value].includes('brain');
  $('learn').parentElement.hidden=!anyBrain;$('learnd').textContent=genius()?'':'It remembers rematches until you close the page.';
  $('speed').hidden=m!='0';
  $('level').parentElement.hidden=m=='2';$('leveld').textContent=m=='0'?'Used by normal bots, not the Brain.':'';
  $('go').hidden=live;$('resume').hidden=$('end').hidden=!live;
  $('go').disabled=!N&&(!$('mine').value||!$('foe').value);
}
function shop(){
  const box=$('shop');box.innerHTML='<small style="color:var(--mute)">Earn coins in You vs bot: +10 per elimination (combos pay more), +25 per gold star, +50 for a win.</small>'+`<small style="color:var(--gold)">Wins ${save.wins} · Matches ${save.played} · Kills ${save.kills} · Accuracy ${save.shots?Math.round(100*save.hits/save.shots):0}%</small><small style="color:var(--mute)">${Object.entries(ACH).map(([k,v])=>(save.ach[k]?'🏆 ':'🔒 ')+v[0]).join('  ')}</small>`;
  const row=(title,info,label,off,fn)=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<span>${title}<small>${info}</small></span>`;const b=document.createElement('button');b.textContent=label;b.disabled=off;b.onclick=()=>{fn();keep();shop()};d.append(b);box.append(d)};
  for(const [k,[n,cost,info]] of Object.entries(ITEMS))row(`${n} ×${save.inv[k]||0}`,info,'🪙 '+cost,save.coins<cost,()=>{save.coins-=cost;save.inv[k]=(save.inv[k]||0)+1});
  for(const [k,[n,cost]] of Object.entries(SKINS)){const has=save.owned.includes(k);row(n+' skin','Your team color.',save.skin==k?'Equipped':has?'Equip':'🪙 '+cost,save.skin==k||!has&&save.coins<cost,()=>{if(!has){save.coins-=cost;save.owned.push(k)}save.skin=k})}
}
function tab(s){$('shop').hidden=!s;$('play').hidden=s;$('tShop').className=s?'on':'';$('tPlay').className=s?'':'on';if(s)shop()}
// ---------- input ----------
function aim(e,tap){
  if(st!='aim'||!human()||paused||count>0)return;
  const b=cv.getBoundingClientRect(),x=(e.clientX-b.left-view.w/2)/view.k+cam.x,y=(e.clientY-b.top-view.h/2)/view.k+cam.y;
  if(tap){const o=alive(turn).filter(o=>o!==me&&D(o,{x,y})<22).sort((p,q)=>D(p,{x,y})-D(q,{x,y}))[0];if(o){me=o;angle=me.x>300?Math.PI:0;return ui()}}
  if(nerd())return say(`Point (${gx({x}).toFixed(1)}, ${gy({y}).toFixed(1)}). You are at (${gx(me).toFixed(1)}, ${gy(me).toFixed(1)}).`);
  angle=Math.atan2(y-me.y,x-me.x);
}
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);aim(e,true)};
cv.onpointermove=e=>{if(e.buttons)aim(e)};
$('fire').onclick=fire;
$('go').onclick=()=>{paused=false;count=3;reset();started=true;$('menu').hidden=true};
$('tPlay').onclick=()=>tab(false);$('tShop').onclick=()=>tab(true);
$('snd').onclick=()=>{muted=!muted;save.muted=muted;keep();$('snd').textContent=muted?'🔇':'🔊'};
addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button'))tone(660,.05,'triangle',880,.06)});
$('speed').onclick=()=>{speed=speed==4?1:speed*2;$('speed').textContent=speed+'×'};
$('pause').onclick=()=>{paused=!paused;ui()};
$('open').onclick=()=>{menu();$('menu').hidden=false};
$('resume').onclick=()=>$('menu').hidden=true;
$('end').onclick=()=>{finish('Match ended.');menu()};
$('dir').onclick=()=>{dir=-dir;$('dir').textContent=dir>0?'→':'←'};
$('eq').onkeydown=e=>{if(e.key=='Enter'){fire();$('eq').blur()}};
for(const id of ['game','rules','level','mine','foe','size','learn'])$(id).onchange=menu;
$('mode').onchange=()=>{$('mine').value='';$('foe').value=mode()=='2'?'':'random';menu()};
$('again').onclick=()=>$('go').onclick();
addEventListener('keydown',e=>{if(e.target.id=='eq'||$('menu').hidden===false)return;const k=e.key;
  if(k==' '||k=='Enter'){e.preventDefault();fire()}else if(k=='p'||k=='P')$('pause').click();else if(k=='m'||k=='M')$('snd').click();
  else if(st=='aim'&&human()&&!nerd()){if(k=='ArrowLeft')angle-=.04;if(k=='ArrowRight')angle+=.04;if(k=='ArrowUp')$('bend').value=+$('bend').value+5;if(k=='ArrowDown')$('bend').value=+$('bend').value-5}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&started&&st!='over'&&!paused){paused=true;ui()}});
muted=!!save.muted;$('snd').textContent=muted?'🔇':'🔊';
{const day=new Date().toDateString();if(save.day!=day){save.day=day;save.coins+=20;document.querySelector('.sub').textContent='Daily bonus: +20 🪙'}}
reset();st='over';$('big').dataset.msg='';menu();requestAnimationFrame(frame);
</script>
